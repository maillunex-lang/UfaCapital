openapi: 3.1.0
info:
  title: UFACAPITAL API
  version: 0.1.0
  description: Сервер — источник денег, товаров и прав. Суммы — десятичные строки без дроби, в копейках целого счёта.
servers:
  - url: http://127.0.0.1:8088
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email: { type: string }
                password: { type: string, minLength: 12, maxLength: 128 }
                display_name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200": { description: session, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: session, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/companies:
    post:
      operationId: createCompany
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200": { description: company, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/companies/board:
    get:
      operationId: playerBoard
      responses:
        "200": { description: board, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
  /api/v1/market/orders:
    post:
      operationId: placeOrder
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "200": { description: order, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
        "400": { $ref: "#/components/responses/Error" }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              request_id: { type: string }
              server_time: { type: string }
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    Money:
      type: string
      pattern: "^[0-9]+$"
      description: Неотрицательное целое в минимальных единицах. Не число JSON.
    Envelope:
      type: object
      required: [data]
      properties:
        request_id: { type: string }
        server_time: { type: string }
        data: {}
    Order:
      type: object
      required: [company_id, good, side, price, qty]
      properties:
        company_id: { type: string, format: uuid }
        good: { type: string, enum: [grain, flour, bread] }
        side: { type: string, enum: [buy, sell] }
        price: { $ref: "#/components/schemas/Money" }
        qty: { $ref: "#/components/schemas/Money" }
