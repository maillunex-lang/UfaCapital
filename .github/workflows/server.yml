name: server
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6@sha256:e923a22ac074261dd73970c57edf659475bf0497cb9456f17d98ed7cdd3ca913
        env:
          POSTGRES_USER: ufacapital
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ufacapital
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ufacapital"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.27.4"
      - name: go test
        env:
          DATABASE_URL: postgres://ufacapital@127.0.0.1:5432/ufacapital?sslmode=disable
        run: go test ./... -count=1
      - name: docs-check
        run: |
          node scripts/docs-check.mjs
          node scripts/docs-check.mjs --expect-fail tests/contracts/broken-link.md
